name: Extract portfolio source
on:
  push:
    paths:
      - 'jack-3d-creator-source.zip'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Extract and commit the site
        shell: bash
        run: |
          set -euo pipefail
          unzip -q jack-3d-creator-source.zip
          cp -a jack-3d-creator/. .
          rm -rf jack-3d-creator jack-3d-creator-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add complete Jack 3D Creator portfolio source"
            git push origin HEAD:main
          fi
